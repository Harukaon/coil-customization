name: Desktop beta release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-beta-release
  cancel-in-progress: false

env:
  NODE_VERSION: 22.19.0

jobs:
  prepare-release:
    name: Open the draft release
    runs-on: ubuntu-latest
    steps:
      # Created up front and left as a draft so both platform builds have
      # somewhere to upload to. Nobody sees it until both builds succeed.
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --prerelease \
              --title "CoilCoil $TAG" \
              --notes "Automated desktop beta build from ${{ github.sha }}."
          fi

  build-windows:
    name: Build Windows x64 and arm64
    needs: prepare-release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/pi/package-lock.json

      - name: Prepare dependencies and native modules
        run: |
          npm ci --prefix vendor/pi --ignore-scripts
          npm run hydrate:model-data --prefix vendor/pi
          npm ci --ignore-scripts
          npm run patch:chrome-devtools-mcp
          npm rebuild node-pty esbuild
          node node_modules/electron/install.js

      - name: Verify bundled node-pty prebuilds
        shell: pwsh
        run: |
          $required = @(
            "node_modules/node-pty/prebuilds/win32-x64/conpty.node",
            "node_modules/node-pty/prebuilds/win32-arm64/conpty.node",
            "node_modules/node-pty/prebuilds/win32-x64/conpty_console_list.node",
            "node_modules/node-pty/prebuilds/win32-arm64/conpty_console_list.node"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing node-pty prebuild: $file" }
          }

      - name: Stamp beta version
        run: npm run release:version -- "${{ github.run_number }}"

      - name: Build NSIS installers and ZIP
        run: npm run package --workspace @coilcoil/desktop -- --win

      - name: Attach Windows installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: gh release upload "$TAG" apps/desktop/release/*.exe apps/desktop/release/*.zip --clobber --repo "${{ github.repository }}"

  build-macos:
    name: Build macOS arm64
    needs: prepare-release
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/pi/package-lock.json

      - name: Prepare dependencies and native modules
        run: |
          npm ci --prefix vendor/pi --ignore-scripts
          npm run hydrate:model-data --prefix vendor/pi
          npm ci --ignore-scripts
          npm run patch:chrome-devtools-mcp
          npm rebuild node-pty esbuild
          node node_modules/electron/install.js

      - name: Stamp beta version
        run: npm run release:version -- "${{ github.run_number }}"

      - name: Build macOS DMG and ZIP
        run: npm run package --workspace @coilcoil/desktop -- --mac

      - name: Attach macOS packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: gh release upload "$TAG" apps/desktop/release/*.dmg apps/desktop/release/*.zip --clobber --repo "${{ github.repository }}"

  finalize-release:
    name: Publish the release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: gh release edit "$TAG" --draft=false --prerelease --repo "${{ github.repository }}"

  # Copies the three main installers to our own server so the Spark AI site can
  # offer them on its Agent page. Runs only after the GitHub release is public;
  # if it fails, the GitHub release itself is unaffected.
  publish-to-server:
    name: Upload installers to our server
    needs: finalize-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: v0.1.0-beta.${{ github.run_number }}
      DL_HOST: 207.57.131.51
      DL_PORT: "30680"
      DL_USER: coil-dl
      SITE: https://ai.sparkai.si
    steps:
      - name: Download the main installers from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "stage/$TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir "stage/$TAG" \
            --pattern '*-arm64.dmg' --pattern '*-arm64.exe' --pattern '*-x64.exe'
          ls -la "stage/$TAG"
          test "$(ls "stage/$TAG" | wc -l)" -eq 3

      - name: Write latest.json
        run: |
          cd stage
          mac=$(ls "$TAG"/*-arm64.dmg)
          winarm=$(ls "$TAG"/*-arm64.exe)
          winx64=$(ls "$TAG"/*-x64.exe)
          item() {
            jq -n --arg p "$1" --arg n "$(basename "$2")" --arg u "/downloads/$TAG/$(basename "$2")" \
              --argjson s "$(stat -c %s "$2")" --arg h "$(sha256sum "$2" | cut -d' ' -f1)" \
              '{platform:$p,name:$n,url:$u,size:$s,sha256:$h}'
          }
          files=$( { item mac-arm64 "$mac"; item win-x64 "$winx64"; item win-arm64 "$winarm"; } | jq -s . )
          jq -n --arg v "${TAG#v}" --arg t "$TAG" --arg at "$(date -u +%FT%TZ)" --arg c "${{ github.sha }}" \
            --argjson f "$files" '{version:$v,tag:$t,publishedAt:$at,commit:$c,files:$f}' > latest.json
          cat latest.json

      - name: Upload to the server (installers first, latest.json last)
        env:
          DL_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DL_KEY" > ~/.ssh/dl_key
          chmod 600 ~/.ssh/dl_key
          echo "[$DL_HOST]:$DL_PORT ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHK9L4fwiS1Z6O5/Mqas+tNixKaDJyzH3sLcpqaB0i7O" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/dl_key -p $DL_PORT -o BatchMode=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          rsync -rt --partial --chmod=F644,D755 -e "$SSH" "stage/$TAG/" "$DL_USER@$DL_HOST:/$TAG/"
          rsync -t --chmod=F644 -e "$SSH" stage/latest.json "$DL_USER@$DL_HOST:/latest.json"

      - name: Check the public links work
        run: |
          curl -fsS "$SITE/downloads/latest.json" | jq -e --arg t "$TAG" '.tag == $t' >/dev/null
          for u in $(jq -r '.files[].url' stage/latest.json); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$SITE$u")
            echo "$code $u"
            test "$code" = "200"
          done
